# Reviewed partial manifest: password definitions only, never saved field values.
# ESPN is called directly by transform.js; no Sites or external collector.
---
id: 536256
name: Sports Detail
strategy: polling
polling_verb: get
polling_url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/11
refresh_interval: 15
framework_version: 3.4.6
dark_mode: 'no'
no_screen_padding: 'no'
custom_fields:
  - keyname: espn_s2
    field_type: password
    name: APEX ESPN S2
    description: ESPN espn_s2 cookie for APEX. Existing saved value is retained.
  - keyname: espn_swid
    field_type: password
    name: APEX ESPN SWID
    description: ESPN SWID cookie, including braces. Also used for NOB if its optional SWID is blank.
  - keyname: nob_espn_s2
    field_type: password
    name: NOB ESPN S2
    description: Separate ESPN espn_s2 cookie for the NOB league.
  - keyname: nob_espn_swid
    field_type: password
    name: NOB ESPN SWID (optional)
    optional: true
    description: Only needed if NOB uses a different SWID. Otherwise leave blank.
  - keyname: season
    field_type: number
    name: Fantasy season
    default: 2026
