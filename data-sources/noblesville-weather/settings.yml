# Hidden hourly weather source for Home Page (plugin setting 535610).
# Playlist item 901506 remains hidden while Plugin Merge reads its data.
# Source namespace: private_plugin_536062.merge_variables
# Noblesville, Indiana city center: 40.0456,-86.0086.
# Daily dates use America/Indiana/Indianapolis; temperatures are Fahrenheit.
# 14 forecast days are fetched; Home Page displays a rolling 7-day agenda.
# precipitation_probability_max is the daily chance of precipitation, including snow.
